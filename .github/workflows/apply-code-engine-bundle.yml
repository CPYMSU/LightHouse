name: Apply Code Engine Bundle

on:
  push:
    branches: ["feat/codex-engine-integration"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract implementation bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          bundle = Path('.code-engine-bundle.tar.gz.b64')
          payload = base64.b64decode(bundle.read_text(encoding='ascii'))
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'c43117016d6841ade6a4772b21899bac4161b3ca7abbf8b9c521c2e5eb9c4364'
          if digest != expected:
              raise SystemExit(f'bundle digest mismatch: {digest}')
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe bundle member: {member.name}')
              archive.extractall('.')
          bundle.unlink()
          Path('.github/workflows/apply-code-engine-bundle.yml').unlink()
          PY
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Codex-compatible code engine and Rust kernel'
          git push origin HEAD:feat/codex-engine-integration
