name: Apply Code Engine Bundle

on:
  push:
    branches: ["feat/codex-engine-integration"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract implementation bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile
          parts = sorted(Path('.').glob('.code-engine-bundle.part-*'))
          if len(parts) != 13:
              raise SystemExit(f'expected 13 bundle parts, found {len(parts)}')
          encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'c43117016d6841ade6a4772b21899bac4161b3ca7abbf8b9c521c2e5eb9c4364'
          if digest != expected:
              raise SystemExit(f'bundle digest mismatch: {digest}')
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe bundle member: {member.name}')
              archive.extractall('.')
          for part in parts:
              part.unlink()
          Path('.code-engine-bundle.tar.gz.b64').unlink(missing_ok=True)
          # Workflow changes are committed separately by the GitHub App because
          # the ephemeral Actions token cannot modify workflow files.
          Path('.github/workflows/rust-code-kernel.yml').unlink(missing_ok=True)
          PY
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Commit implementation source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Codex-compatible code engine and Rust kernel'
          git push origin HEAD:feat/codex-engine-integration
