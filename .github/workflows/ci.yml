name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lighthouse
          POSTGRES_USER: lighthouse
          POSTGRES_PASSWORD: lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lighthouse -d lighthouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lighthouse:lighthouse@127.0.0.1:5432/lighthouse
      TEST_DATA_DSN: postgresql://lighthouse:lighthouse@127.0.0.1:5432/lighthouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: bash -n install-macos.sh uninstall-macos.sh
      - run: pytest -q
