name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lighthouse
          POSTGRES_USER: lighthouse
          POSTGRES_PASSWORD: lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lighthouse -d lighthouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lighthouse:lighthouse@127.0.0.1:5432/lighthouse
      TEST_DATA_DSN: postgresql://lighthouse:lighthouse@127.0.0.1:5432/lighthouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: bash -n install-macos.sh uninstall-macos.sh
      - name: Parse Windows PowerShell installers
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @(
            'install-windows.ps1',
            'install-windows-database.ps1',
            'install-windows-core.ps1',
            'install-windows-service.ps1',
            'uninstall-windows.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            $allErrors += @($parseErrors)
          }
          if ($allErrors.Count) { throw ($allErrors | Format-List | Out-String) }
      - name: Run pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-linux.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-linux-${{ github.run_attempt }}
          path: pytest-linux.log
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - name: Parse Windows PowerShell installers
        shell: powershell
        run: |
          $allErrors = @()
          foreach ($file in @(
            'install-windows.ps1',
            'install-windows-database.ps1',
            'install-windows-core.ps1',
            'install-windows-service.ps1',
            'uninstall-windows.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            $allErrors += @($parseErrors)
          }
          if ($allErrors.Count) { throw ($allErrors | Format-List | Out-String) }
      - name: Exercise Invoke-Expression bootstrap under StrictMode
        shell: powershell
        run: |
          $env:LIGHTHOUSE_BOOTSTRAP_VALIDATE = '1'
          try {
            $output = (Get-Content -LiteralPath install-windows.ps1 -Raw | Invoke-Expression | Out-String).Trim()
            if ($output -ne 'LightHouse Windows bootstrap OK') {
              throw "unexpected bootstrap output: $output"
            }
          }
          finally {
            Remove-Item Env:LIGHTHOUSE_BOOTSTRAP_VALIDATE -ErrorAction SilentlyContinue
          }
      - name: Validate staged Windows installer entry points
        shell: powershell
        run: |
          $cases = @(
            @{ File = 'install-windows-database.ps1'; Args = @('-Stage', 'Validate'); Expected = 'LightHouse private database bootstrap OK' },
            @{ File = 'install-windows-core.ps1'; Args = @('-Stage', 'Validate'); Expected = 'LightHouse Windows application installer OK' },
            @{ File = 'install-windows-service.ps1'; Args = @('-Stage', 'Validate'); Expected = 'LightHouse Windows background service installer OK' }
          )
          foreach ($case in $cases) {
            $output = (& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $case.File @($case.Args) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $output -ne $case.Expected) {
              throw "validation failed for $($case.File): $output"
            }
          }
      - name: Verify native stderr isolation under ErrorActionPreference Stop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'native-stderr-fixture.py'
          $stdout = Join-Path $env:RUNNER_TEMP 'native-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'native-stderr.log'
          @'
          import sys
          import time
          sys.stderr.write("INFO: Started server process [12345]\n")
          sys.stderr.flush()
          time.sleep(1)
          raise SystemExit(0)
          '@ | Set-Content -LiteralPath $fixture -Encoding UTF8
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $process = Start-Process -FilePath $python -ArgumentList @($fixture) `
            -NoNewWindow -PassThru -Wait `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 0) { throw "fixture exit code: $($process.ExitCode)" }
          $stderrText = Get-Content -LiteralPath $stderr -Raw
          if ($stderrText -notmatch 'INFO: Started server process') {
            throw "native stderr was not captured: $stderrText"
          }
      - name: Run Windows-native contract tests
        run: python -m pytest -q tests/test_windows_support.py tests/test_cli_errors.py
