name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lighthouse
          POSTGRES_USER: lighthouse
          POSTGRES_PASSWORD: lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lighthouse -d lighthouse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lighthouse:lighthouse@127.0.0.1:5432/lighthouse
      TEST_DATA_DSN: postgresql://lighthouse:lighthouse@127.0.0.1:5432/lighthouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: bash -n install-macos.sh uninstall-macos.sh
      - name: Parse Windows PowerShell installers
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @('install-windows.ps1', 'uninstall-windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            $allErrors += @($parseErrors)
          }
          if ($allErrors.Count) { throw ($allErrors | Format-List | Out-String) }
      - run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - name: Parse Windows PowerShell installers
        shell: powershell
        run: |
          $allErrors = @()
          foreach ($file in @('install-windows.ps1', 'uninstall-windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            $allErrors += @($parseErrors)
          }
          if ($allErrors.Count) { throw ($allErrors | Format-List | Out-String) }
      - name: Exercise Invoke-Expression bootstrap under StrictMode
        shell: powershell
        run: |
          $env:LIGHTHOUSE_BOOTSTRAP_VALIDATE = '1'
          try {
            $output = (Get-Content -LiteralPath install-windows.ps1 -Raw | Invoke-Expression | Out-String).Trim()
            if ($output -ne 'LightHouse Windows bootstrap OK') {
              throw "unexpected bootstrap output: $output"
            }
          }
          finally {
            Remove-Item Env:LIGHTHOUSE_BOOTSTRAP_VALIDATE -ErrorAction SilentlyContinue
          }
      - name: Run Windows-native contract tests
        run: python -m pytest -q tests/test_windows_support.py tests/test_cli_errors.py
