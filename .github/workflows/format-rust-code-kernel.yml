name: Format Rust Code Kernel

on:
  push:
    branches: ["feat/codex-engine-integration"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply rustfmt
        run: cargo fmt --manifest-path rust/lighthouse-code-kernel/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/lighthouse-code-kernel/src/main.rs
          git commit -m 'Format Rust code kernel'
          git push origin HEAD:feat/codex-engine-integration
