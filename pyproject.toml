[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lighthouse-os"
version = "1.4.0"
description = "PostgreSQL-first autonomous AI operating terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CPYMSU" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "rich>=13.9,<14",
  "prompt-toolkit>=3.0.48,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
lh = "lighthouse.instance_entry:main"
lighthouse-api = "lighthouse.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lighthouse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build]
include = [
  "src/lighthouse/**/*.py",
  "src/lighthouse/sql/*.sql",
]
