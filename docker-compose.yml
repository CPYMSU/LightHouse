services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lighthouse
      POSTGRES_USER: lighthouse
      POSTGRES_PASSWORD: lighthouse
    ports:
      - "5432:5432"
    volumes:
      - lighthouse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighthouse -d lighthouse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  lighthouse-postgres:
